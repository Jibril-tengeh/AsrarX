name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APKs & AAB Bundle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

    - name: Upload Play Store App Bundle (AAB)
      uses: actions/upload-artifact@v4
      with:
        name: AsrarHub-PlayStore-AAB
        path: android/app/build/outputs/bundle/release/*.aab

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AsrarHub-Release-APK
        path: android/app/build/outputs/apk/release/*.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AsrarHub-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk
