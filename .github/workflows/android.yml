name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make Gradlew Executable
      run: chmod +x android/gradlew

    - name: Build APKs (Debug & Release)
      run: |
        cd android
        ./gradlew assembleDebug assembleRelease -x lint --stacktrace || ./gradlew assembleDebug

    - name: Build Play Store Bundle (AAB)
      run: |
        cd android
        ./gradlew bundleRelease -x lint --stacktrace || ./gradlew bundleDebug

    - name: Upload Play Store Bundle (AAB)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AsrarHub-PlayStore-AAB
        path: android/app/build/outputs/bundle/**/*.aab

    - name: Upload APKs (Release & Debug)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AsrarHub-APKs
        path: android/app/build/outputs/apk/**/*.apk
