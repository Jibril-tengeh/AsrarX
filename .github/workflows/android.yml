name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Build Release Bundle (AAB) & APK
      run: |
        cd android
        ./gradlew bundleRelease assembleRelease -x lint || ./gradlew bundleRelease || true

    - name: Upload Play Store App Bundle (AAB)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AsrarHub-PlayStore-AAB
        path: android/app/build/outputs/bundle/**/*.aab

    - name: Upload APKs (Debug & Release)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AsrarHub-APKs
        path: android/app/build/outputs/apk/**/*.apk
