name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 22 (Required by latest Capacitor)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
        validate-wrappers: false

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make Gradlew Executable & Ensure Gradle Wrapper
      run: |
        cd android
        # Generate official Gradle wrapper directly with the Gradle tool installed on the runner
        gradle wrapper --gradle-version 8.11.1 --distribution-type all
        chmod +x gradlew
        ./gradlew --version
        cd ..

    - name: Prepare Signing Keystore
      run: |
        mkdir -p android/app
        # 1. If GitHub Secret KEYSTORE_BASE64 is configured, use it:
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Restoring keystore from GitHub Secret KEYSTORE_BASE64..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/asrarhub.keystore
        elif [ -f "android/app/asrarhub.keystore" ]; then
          echo "Using existing android/app/asrarhub.keystore from repository..."
        elif [ -f "asrarhub.keystore" ]; then
          echo "Copying root asrarhub.keystore to android/app/..."
          cp asrarhub.keystore android/app/asrarhub.keystore
        else
          echo "Restoring permanent official AsrarHub keystore from static fallback..."
          echo "" | base64 --decode > android/app/asrarhub.keystore
        fi

        # Verify keystore validity:
        if ! keytool -list -keystore android/app/asrarhub.keystore -storepass AsrarHub1492 >/dev/null 2>&1; then
          echo "Keystore verification failed, restoring permanent base64..."
          echo "" | base64 --decode > android/app/asrarhub.keystore
        fi

        cp android/app/asrarhub.keystore android/asrarhub.keystore
        cp android/app/asrarhub.keystore asrarhub.keystore
        ls -la android/app/asrarhub.keystore

    - name: Build APKs (Debug & Release)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'AsrarHub1492' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'asrarhub' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'AsrarHub1492' }}
      run: |
        # Calculate versionCode guaranteed to be strictly increasing and > 100
        DYNAMIC_VERSION_CODE=$(( 100 + ${{ github.run_number }} ))
        echo "Building APKs with versionCode: $DYNAMIC_VERSION_CODE"
        cd android
        ./gradlew assembleRelease assembleDebug -PversionCode=$DYNAMIC_VERSION_CODE -x lint --stacktrace || ./gradlew assembleDebug -PversionCode=$DYNAMIC_VERSION_CODE

    - name: Ensure Release APK is Signed (Sign with apksigner if needed)
      run: |
        RELEASE_DIR="android/app/build/outputs/apk/release"
        UNSIGNED_APK="$RELEASE_DIR/app-release-unsigned.apk"
        SIGNED_APK="$RELEASE_DIR/app-release.apk"
        KEYSTORE="android/app/asrarhub.keystore"

        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
        echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

        # If Gradle created an unsigned APK or if signed APK doesn't exist yet:
        if [ -f "$UNSIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
          SOURCE_APK="$UNSIGNED_APK"
          if [ ! -f "$SOURCE_APK" ]; then
            SOURCE_APK=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$SOURCE_APK" ] && [ -f "$SOURCE_APK" ]; then
            echo "Signing $SOURCE_APK with Android apksigner..."
            
            # Align APK
            rm -f "$RELEASE_DIR/app-release-aligned.apk" "$SIGNED_APK"
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$SOURCE_APK" "$RELEASE_DIR/app-release-aligned.apk"
            
            # Sign APK with v1, v2 and v3
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks "$KEYSTORE" \
              --ks-pass pass:AsrarHub1492 \
              --ks-key-alias asrarhub \
              --key-pass pass:AsrarHub1492 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$SIGNED_APK" \
              "$RELEASE_DIR/app-release-aligned.apk"
              
            # Clean up intermediate files
            rm -f "$UNSIGNED_APK" "$RELEASE_DIR/app-release-aligned.apk"
          fi
        fi

        # Verify signature of the final release APK
        if [ -f "$SIGNED_APK" ]; then
          echo "Verifying signature of $SIGNED_APK:"
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK" || true
        fi
        
        # Hard cleanup: delete ANY file containing 'unsigned' or 'aligned' across all apk folders
        find android/app/build/outputs/apk -name "*unsigned*" -delete || true
        find android/app/build/outputs/apk -name "*aligned*" -delete || true
        
        echo "Final APK contents:"
        find android/app/build/outputs/apk -name "*.apk" -ls

    - name: Build Play Store Bundle (AAB)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'AsrarHub1492' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'asrarhub' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'AsrarHub1492' }}
      run: |
        DYNAMIC_VERSION_CODE=$(( 100 + ${{ github.run_number }} ))
        cd android
        ./gradlew bundleRelease -PversionCode=$DYNAMIC_VERSION_CODE -x lint --stacktrace || ./gradlew bundleDebug -PversionCode=$DYNAMIC_VERSION_CODE

    - name: Upload Play Store Bundle (AAB)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AsrarHub-PlayStore-AAB
        path: android/app/build/outputs/bundle/**/*.aab

    - name: Upload APKs (Release & Debug)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: AsrarHub-APKs
        path: |
          android/app/build/outputs/apk/release/app-release.apk
          android/app/build/outputs/apk/debug/app-debug.apk
