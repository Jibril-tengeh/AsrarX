<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020202" />
      <stop offset="50%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#151515" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#FAD382" />
      <stop offset="60%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#966C15" />
    </linearGradient>

    <!-- Glowing effect for the gold parts -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" />

  <!-- Outer Elegant Gold Ring with dashed ornament -->
  <circle cx="256" cy="256" r="226" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="218" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.7" />
  <circle cx="256" cy="256" r="210" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Centered Majestic Calligraphic Crescent Star Symbol -->
  <g transform="translate(118, 108) scale(2.3)">
    <!-- Outer Golden Crescent Loop -->
    <path
      d="M 54,12 
         C 42,22 30,42 32,64 
         C 34,82 46,94 62,96 
         C 48,96 34,88 26,76 
         C 16,62 14,44 22,26 
         C 26,14 34,6 44,2 
         C 45,1 46,3 45,5 
         C 39,16 32,32 34,50 
         C 36,68 46,82 60,86 
         C 48,84 40,72 38,56 
         C 36,40 44,22 54,12 Z"
      fill="url(#goldGradient)"
      filter="url(#goldGlow)"
    />

    <!-- Inner Artistic Arabic Cursive Accents / Calligraphy strokes -->
    <path
      d="M 45,38 
         C 42,42 38,48 38,55 
         C 38,64 45,71 52,71 
         C 57,71 59,67 57,62 
         C 55,57 50,57 48,62 
         C 45,66 43,66 42,60 
         C 41,54 43,46 45,38 Z"
      fill="url(#goldGradient)"
    />

    <!-- Fine Calligraphic Accent details (Gold tashkeel marks) -->
    <path d="M 33,28 L 39,24 C 40,23 39,22 38,23 L 32,27 C 31,28 32,29 33,28 Z" fill="url(#goldGradient)" />
    <path d="M 47,48 C 48,46 50,46 49,49 C 48,52 46,54 45,52 Z" fill="url(#goldGradient)" />
    <path d="M 28,42 C 29,40 31,40 30,43 C 29,46 27,48 26,46 Z" fill="url(#goldGradient)" />
    
    <!-- Elegant Top 4-Point Star (Sparkle) -->
    <path
      d="M 54,18 L 56.5,23 L 62,24 L 57.5,27 L 58.5,32.5 L 54,29 L 49.5,32.5 L 50.5,27 L 46,24 L 51.5,23 Z"
      fill="url(#goldGradient)"
      filter="url(#goldGlow)"
    />

    <!-- Elegant Bottom 4-Point Star (Sparkle) -->
    <path
      d="M 42,94 L 44,97 L 48,98 L 44,99 L 42,102 L 40,99 L 36,98 L 40,97 Z"
      fill="url(#goldGradient)"
    />
  </g>
</svg>
