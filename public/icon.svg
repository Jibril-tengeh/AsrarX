<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDFDFD" />
    </radialGradient>

    <!-- Top Sun Gradient -->
    <linearGradient id="topSunGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Bottom Rays Gradient -->
    <linearGradient id="bottomTealGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Rich Gold Text Gradient (Glossy Beveled Look) -->
    <linearGradient id="textGoldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="30%" stop-color="#F5B041" />
      <stop offset="70%" stop-color="#C0392B" />
      <stop offset="100%" stop-color="#78281F" />
    </linearGradient>

    <!-- Realistic Gold Metallic Gradient for the main text -->
    <linearGradient id="realGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="20%" stop-color="#F5C045" />
      <stop offset="40%" stop-color="#D4AC0D" />
      <stop offset="60%" stop-color="#F1C40F" />
      <stop offset="80%" stop-color="#B7950B" />
      <stop offset="100%" stop-color="#7D6608" />
    </linearGradient>

    <!-- Subtle Drop Shadows for 3D depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#78350F" flood-opacity="0.12" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#78350F" flood-opacity="0.25" />
    </filter>

    <!-- Tapered Ray Shapes -->
    <!-- Long Ray -->
    <path id="ray-long" d="M -3,-124 C -5.5,-124 -6.5,-134 -1,-184 C 0,-189 0,-189 1,-184 C 6.5,-134 5.5,-124 3,-124 Z" />
    <!-- Medium Ray -->
    <path id="ray-medium" d="M -2.5,-124 C -4.5,-124 -5.5,-131 -1,-164 C 0,-168 0,-168 1,-164 C 5.5,-131 4.5,-124 2.5,-124 Z" />
    <!-- Short Ray -->
    <path id="ray-short" d="M -2,-124 C -3.5,-124 -4.5,-128 -0.5,-146 C 0,-149 0,-149 0.5,-146 C 4.5,-128 3.5,-124 2,-124 Z" />
  </defs>

  <!-- Solid white rounded square background for clean look -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Outer Ring elements -->
  <!-- Top Semicircle Arc (Orange/Gold) -->
  <path d="M 146 256 A 110 110 0 0 1 366 256" stroke="url(#topSunGradient)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />
  
  <!-- Bottom Semicircle Arc (Teal/Green) -->
  <path d="M 146 256 A 110 110 0 0 0 366 256" stroke="url(#bottomTealGradient)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />

  <!-- TOP HALF RAYS (ORANGE-GOLD) -->
  <g fill="url(#topSunGradient)" filter="url(#shadow)">
    <!-- -160 (Short) -->
    <use href="#ray-short" transform="translate(256, 256) rotate(-160)" />
    
    <!-- -145 (Medium-Long with Dot) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(-145)" />
    <circle cx="0" cy="-172" r="4.5" transform="translate(256, 256) rotate(-145)" />

    <!-- -130 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(-130)" />

    <!-- -115 (Long) -->
    <use href="#ray-long" transform="translate(256, 256) rotate(-115)" />

    <!-- -100 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(-100)" />

    <!-- -90 (Longest with Dot - Center Up) -->
    <use href="#ray-long" transform="translate(256, 256) rotate(-90)" />
    <circle cx="0" cy="-194" r="5" transform="translate(256, 256) rotate(-90)" />

    <!-- -80 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(-80)" />

    <!-- -65 (Long) -->
    <use href="#ray-long" transform="translate(256, 256) rotate(-65)" />

    <!-- -50 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(-50)" />

    <!-- -35 (Medium-Long with Dot) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(-35)" />
    <circle cx="0" cy="-172" r="4.5" transform="translate(256, 256) rotate(-35)" />

    <!-- -20 (Short) -->
    <use href="#ray-short" transform="translate(256, 256) rotate(-20)" />
  </g>

  <!-- BOTTOM HALF RAYS (TEAL-GREEN) -->
  <g fill="url(#bottomTealGradient)" filter="url(#shadow)">
    <!-- 20 (Short) -->
    <use href="#ray-short" transform="translate(256, 256) rotate(20)" />

    <!-- 35 (Medium-Long with Dot) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(35)" />
    <circle cx="0" cy="-172" r="4.5" transform="translate(256, 256) rotate(35)" />

    <!-- 50 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(50)" />

    <!-- 65 (Long) -->
    <use href="#ray-long" transform="translate(256, 256) rotate(65)" />

    <!-- 80 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(80)" />

    <!-- 90 (Longest with Dot - Center Down) -->
    <use href="#ray-long" transform="translate(256, 256) rotate(90)" />
    <circle cx="0" cy="-194" r="5" transform="translate(256, 256) rotate(90)" />

    <!-- 100 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(100)" />

    <!-- 115 (Long) -->
    <use href="#ray-long" transform="translate(256, 256) rotate(115)" />

    <!-- 130 (Medium) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(130)" />

    <!-- 145 (Medium-Long with Dot) -->
    <use href="#ray-medium" transform="translate(256, 256) rotate(145)" />
    <circle cx="0" cy="-172" r="4.5" transform="translate(256, 256) rotate(145)" />

    <!-- 160 (Short) -->
    <use href="#ray-short" transform="translate(256, 256) rotate(160)" />
  </g>

  <!-- CENTRAL BRAND TYPOGRAPHY -->
  <rect x="110" y="216" width="292" height="80" rx="40" fill="#FFFFFF" />
  
  <g filter="url(#textShadow)">
    <text
      x="256"
      y="276"
      text-anchor="middle"
      fill="url(#realGold)"
      font-size="60"
      font-weight="800"
      font-family="'Playfair Display', 'Georgia', 'Cinzel', serif"
      letter-spacing="-0.02em"
    >AsrarHub</text>
  </g>
</svg>
