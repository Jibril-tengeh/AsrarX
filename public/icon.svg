<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0814" />
      <stop offset="50%" stop-color="#0e0d26" />
      <stop offset="100%" stop-color="#06050d" />
    </linearGradient>
    
    <!-- Gold Gradient matching the brand -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="30%" stop-color="#FAD382" />
      <stop offset="70%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#966C15" />
    </linearGradient>
    
    <!-- Gold Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle (Rounded Rect) Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Elegant Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 6" opacity="0.25" />

  <!-- Mystic Sacred Geometry Points in Background -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="5 5" />
  </g>

  <!-- Large Majestic Crescent Symbol (Centered) -->
  <g transform="translate(256, 245) scale(3.2)">
    <!-- Crescent Moon Loop (adapted from AsrarLogo) -->
    <path
      d="M 16,-34 
         C 4,-24 -8,-4 -6,18 
         C -4,36 8,48 24,50 
         C 10,50 -4,42 -12,30 
         C -22,16 -24,-2 -16,-20 
         C -12,-32 -4,-40 6,-44 
         C 7,-45 8,-43 7,-41 
         C 1,-30 -6,-14 -4,4 
         C -2,22 8,36 22,40 
         C 10,38 2,26 0,10 
         C -2,-6 6,-24 16,-34 Z"
      fill="url(#goldGrad)"
      filter="url(#glow)"
    />
    <!-- Calligraphic Arabic-style strokes inside -->
    <path
      d="M 7,-8 
         C 4,-4 0,2 0,9 
         C 0,18 7,25 14,25 
         C 19,25 21,21 19,16 
         C 17,11 12,11 10,16 
         C 7,20 5,20 4,14 
         C 3,8 5,0 7,-8 Z"
      fill="url(#goldGrad)"
    />
    <!-- Accents -->
    <path d="M -5,-18 L 1,-22 C 2,-23 1,-24 0,-23 L -6,-19 C -7,-18 -6,-17 -5,-18 Z" fill="url(#goldGrad)" />
    <path d="M 9,2 C 10,0 12,0 11,3 C 10,6 8,8 7,6 Z" fill="url(#goldGrad)" />
    <path d="M -10,-4 C -9,-6 -7,-6 -8,-3 C -9,0 -11,2 -12,0 Z" fill="url(#goldGrad)" />
    
    <!-- Stars -->
    <!-- Top Sparkle Star -->
    <path
      d="M 16,-28 L 18.5,-23 L 24,-22 L 19.5,-19 L 20.5,-13.5 L 16,-17 L 11.5,-13.5 L 12.5,-19 L 8,-22 L 13.5,-23 Z"
      fill="url(#goldGrad)"
    />
    <!-- Bottom Sparkle Star -->
    <path
      d="M 4,48 L 6,51 L 10,52 L 6,53 L 4,56 L 2,53 L -2,52 L 2,51 Z"
      fill="url(#goldGrad)"
    />
  </g>
</svg>
